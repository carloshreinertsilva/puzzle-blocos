<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Convite para o CapiBlocks</title>
  <meta name="description" content="Um amigo te chamou para o CapiBlocks! Entre pelo convite e ganhe 50 estrelas e um presente.">
  <meta property="og:title" content="Vem jogar CapiBlocks comigo!">
  <meta property="og:description" content="Encaixe blocos, salve filhotes e construa a Vila do Capi. Entrando pelo convite você ganha 50 estrelas e um presente.">
  <meta property="og:image" content="https://capiblocks.vercel.app/convite/banner.png">
  <meta property="og:image:width" content="1024">
  <meta property="og:image:height" content="500">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    :root { --bg-top: #1C2155; --bg-bottom: #2A1650; --text: #F4F1FF; --dim: #C3BDE0; --accent: #FFC94D; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom)); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
    main { max-width: 440px; width: 100%; text-align: center; }
    img.banner { width: 100%; border-radius: 18px; box-shadow: 0 8px 30px rgba(0,0,0,.4); }
    h1 { font-size: 26px; margin: 20px 0 8px; }
    p { color: var(--dim); line-height: 1.5; }
    .codigo { display: inline-block; margin: 16px 0; padding: 10px 18px; border-radius: 14px; font-size: 28px; letter-spacing: 4px;
      font-weight: 800; color: var(--accent); background: rgba(255,255,255,.06); border: 1px dashed rgba(255,201,77,.6); }
    a.botao { display: block; margin: 10px 0; padding: 14px; border-radius: 16px; font-weight: 800; font-size: 18px;
      text-decoration: none; color: #3A2200; background: var(--accent); box-shadow: 0 5px 0 #C98A1E; }
    a.botao.sec { background: #E7E3FF; box-shadow: 0 5px 0 #9C93D6; color: #1C2155; }
    small { display: block; margin-top: 18px; color: var(--dim); font-size: 13px; }
    small a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <img class="banner" src="/convite/banner.png" alt="CapiBlocks: encaixe blocos, salve filhotes e construa a Vila do Capi">
    <h1>Você foi convidado! 🎁</h1>
    <p>Entre no CapiBlocks pelo convite e ganhe <strong>50 estrelas</strong> e o <strong>Laço da Amizade</strong> para o seu Capi.</p>
    <div id="caixa-codigo" hidden>
      <div class="codigo" id="codigo"></div>
      <p id="dica-ios">No iPhone, abra o jogo e toque em <strong>Convide amigos</strong> → <strong>Tenho um convite</strong> para usar o código.</p>
    </div>
    <a class="botao" id="play" href="https://play.google.com/store/apps/details?id=com.capiblocks.app">Baixar no Android (Google Play)</a>
    <a class="botao sec" href="https://capiblocks.vercel.app/">Jogar no navegador</a>
    <small>CHS TECNOLOGIA · <a href="/privacidade/">Privacidade</a></small>
  </main>
  <script>
    (function () {
      var c = (new URLSearchParams(location.search).get('c') || '').toUpperCase().replace(/[^A-HJKMNP-Z2-9]/g, '');
      if (c.length !== 6) return;
      document.getElementById('codigo').textContent = c;
      document.getElementById('caixa-codigo').hidden = false;
      // The Play Store hands the code to the game on its first run.
      document.getElementById('play').href =
        'https://play.google.com/store/apps/details?id=com.capiblocks.app&referrer=' +
        encodeURIComponent('utm_source=convite&convite=' + c);
    })();
  </script>
</body>
</html>
