<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="CapiBlocks: quebra-cabeça de blocos.">
  <meta name="theme-color" content="#1C2155">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="CapiBlocks">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>CapiBlocks</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preload" href="assets/assets/fonts/LilitaOne-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="abertura.webp" as="image">
  <style>
    @font-face { font-family: Lilita; src: url(assets/assets/fonts/LilitaOne-Regular.ttf); }
    html, body { margin: 0; height: 100%; background: #1C2155; }
    #splash {
      position: fixed; inset: 0; z-index: 10; overflow: hidden;
      background: linear-gradient(#1C2155, #2A1650);
      transition: opacity .35s ease;
    }
    #splash.done { opacity: 0; pointer-events: none; }
    /* Capi hauling a block into the Vila do Capi (same art as the app). */
    #splash .arte {
      position: absolute; inset: 0;
      background: url(abertura.webp) 50% 70% / cover no-repeat;
    }
    #splash .sombra-cima, #splash .sombra-baixo { position: absolute; left: 0; right: 0; }
    #splash .sombra-cima { top: 0; height: 230px; background: linear-gradient(rgba(28,33,85,.7), rgba(28,33,85,0)); }
    #splash .sombra-baixo { bottom: 0; height: 220px; background: linear-gradient(rgba(22,15,51,0), rgba(22,15,51,.9)); }
    #splash .title {
      position: absolute; left: 0; right: 0; top: calc(env(safe-area-inset-top) + 40px);
      text-align: center;
      font: 52px/1 Lilita, system-ui, -apple-system, sans-serif;
      color: #fff; letter-spacing: .5px;
      text-shadow: 0 4px 0 #2A1458, 0 0 12px rgba(0,0,0,.55);
    }
    #splash .carga {
      position: absolute; left: 50%; transform: translateX(-50%);
      bottom: calc(env(safe-area-inset-bottom) + 36px);
      width: min(296px, calc(100% - 64px));
      font: 18px/1 Lilita, system-ui, -apple-system, sans-serif; color: #fff;
    }
    #splash .carga span { display: block; margin-bottom: 8px; }
    #splash .barra {
      box-sizing: border-box; height: 20px; padding: 3px; border-radius: 10px;
      background: rgba(0,0,0,.4); border: 1.5px solid rgba(255,255,255,.33);
    }
    #splash .barra i {
      display: block; height: 100%; width: 4%; border-radius: 7px;
      background: linear-gradient(rgba(255,255,255,.4), rgba(255,255,255,0) 60%),
                  linear-gradient(90deg, #FF8A3D, #FFC94D);
      animation: carga 9s cubic-bezier(.15,.7,.3,1) forwards;
    }
    #splash .barra i.cheia { animation: none; transition: width .25s ease-out; }
    @keyframes carga { to { width: 90%; } }
    @media (prefers-reduced-motion: reduce) { #splash .barra i { animation-duration: 1ms; } }
    /* Challenge invite (Android, from a challenge link): play here or get the app. */
    #convite {
      position: fixed; inset: 0; z-index: 20; display: none;
      align-items: center; justify-content: center; padding: 24px;
      background: rgba(10, 8, 40, .72);
      font-family: system-ui, -apple-system, sans-serif;
    }
    #convite.aberto { display: flex; }
    #convite .cartao {
      width: 100%; max-width: 360px; box-sizing: border-box; padding: 24px 20px;
      border-radius: 22px; text-align: center; color: #F4F1FF;
      background: linear-gradient(#2E3577, #1C2155); border: 2px solid #FFC94D;
    }
    #convite h1 { font: 30px/1.1 Lilita, system-ui, sans-serif; margin: 0 0 8px; }
    #convite p { margin: 0 0 18px; font-size: 16px; line-height: 1.4; color: #D8D4FF; }
    #convite b { color: #FFC94D; }
    #convite a, #convite button {
      display: block; width: 100%; box-sizing: border-box; margin-top: 10px;
      padding: 14px; border-radius: 16px; border: 0; cursor: pointer;
      font: 20px/1 Lilita, system-ui, sans-serif; text-decoration: none;
    }
    #convite .baixar { background: #FFC94D; color: #3A2200; box-shadow: inset 0 -4px 0 rgba(0,0,0,.2); }
    #convite .jogar { background: transparent; color: #F4F1FF; border: 2px solid #6B6FB8; }
  </style>
</head>
<body>
  <div id="splash" role="progressbar" aria-label="Carregando">
    <div class="arte"></div>
    <div class="sombra-cima"></div>
    <div class="sombra-baixo"></div>
    <div class="title">CapiBlocks</div>
    <div class="carga"><span>Carregando</span><div class="barra"><i></i></div></div>
  </div>
    <div class="title">CapiBlocks</div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <div id="convite" role="dialog" aria-label="Desafio no CapiBlocks">
    <div class="cartao">
      <h1>Você foi desafiado!</h1>
      <p>Um amigo fez <b id="convite-meta">muitos</b> pontos neste tabuleiro. Consegue passar?</p>
      <a class="baixar" href="https://play.google.com/store/apps/details?id=com.capiblocks.app&amp;referrer=utm_source%3Dduelo">Baixar o app grátis</a>
      <button class="jogar" type="button">Jogar aqui no navegador</button>
    </div>
  </div>
  <script>
    // A challenge link opened on an Android phone without the app: offer the
    // Play Store, or play right here (the game keeps loading underneath).
    (function () {
      var url = new URL(location.href);
      var q = url.searchParams;
      var path = url.pathname.replace(/\/$/, '');
      var desafio = (path === '/duelo' && q.get('s')) || q.get('duelo');
      if (!desafio || !/Android/i.test(navigator.userAgent)) return;
      var meta = parseInt(q.get('p') || '', 10);
      if (meta > 0) {
        document.getElementById('convite-meta').textContent = meta.toLocaleString('pt-BR');
      }
      var convite = document.getElementById('convite');
      convite.classList.add('aberto');
      convite.querySelector('.jogar').addEventListener('click', function () {
        convite.classList.remove('aberto');
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
