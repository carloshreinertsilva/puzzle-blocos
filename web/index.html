<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="CapiBlocks: quebra-cabeça de blocos.">
  <meta name="theme-color" content="#1C2155">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="CapiBlocks">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>CapiBlocks</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preload" href="assets/assets/fonts/LilitaOne-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <style>
    @font-face { font-family: Lilita; src: url(assets/assets/fonts/LilitaOne-Regular.ttf); }
    html, body { margin: 0; height: 100%; background: #1C2155; }
    #splash {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: linear-gradient(#1C2155, #2A1650);
      transition: opacity .35s ease;
    }
    #splash.done { opacity: 0; pointer-events: none; }
    #splash .blocks { display: flex; gap: 8px; margin-bottom: 22px; }
    #splash .blocks i {
      width: 28px; height: 28px; border-radius: 7px;
      box-shadow: inset 0 -5px 0 rgba(0,0,0,.25), inset 0 4px 0 rgba(255,255,255,.35);
      animation: hop 1s ease-in-out infinite;
    }
    #splash .blocks i:nth-child(1) { background: #FFA94D; }
    #splash .blocks i:nth-child(2) { background: #FFD43B; animation-delay: .12s; }
    #splash .blocks i:nth-child(3) { background: #51CF66; animation-delay: .24s; }
    #splash .blocks i:nth-child(4) { background: #22B8CF; animation-delay: .36s; }
    #splash .title {
      font: 38px/1 Lilita, system-ui, -apple-system, sans-serif;
      color: #fff; letter-spacing: .5px;
      text-shadow: 0 3px 0 #2A1458;
    }
    @keyframes hop {
      0%, 100% { transform: translateY(0); }
      40% { transform: translateY(-14px); }
    }
    @media (prefers-reduced-motion: reduce) { #splash .blocks i { animation: none; } }
  </style>
</head>
<body>
  <div id="splash" aria-label="Carregando">
    <div class="blocks"><i></i><i></i><i></i><i></i></div>
    <div class="title">CapiBlocks</div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
