# Instala a versão de lançamento num emulador e confere se o jogo abre.
name: Android (abre no emulador)

on:
  push:
    branches: ['claude/android-controle']
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  abre:
    name: Android (abre no emulador)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # A imagem do emulador não cabe no disco que sobra depois do build.
      - name: Liberar espaço em disco
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL /usr/share/swift
          sudo docker image prune --all --force > /dev/null || true
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Versão da biblioteca de progresso salvo
        run: grep -A7 '^  shared_preferences_android:' pubspec.lock | grep version
      - name: APK de lançamento
        run: flutter build apk --release --target-platform android-x64
      - run: python3 -m pip install pillow
      - name: Liberar o emulador (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Abrir o jogo no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash tool/android_abre.sh
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: android-abre
          path: build/android_abre
          retention-days: 14
