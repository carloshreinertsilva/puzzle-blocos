# Verifica o jogo a cada envio e a cada pull request:
# 1. formatação, análise do código e testes de unidade (Flutter);
# 2. versão web de teste (com a ponte de testes) gerada uma vez;
# 3. testes Playwright de ponta a ponta, um job por tamanho de tela.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', '.claude/**']
  # Pull requests always run, so a required check never waits forever on a
  # PR that only touches docs.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  flutter:
    name: Flutter (análise e testes)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Formatação
        run: dart format --output=none --set-exit-if-changed lib test tool
      - name: Análise
        run: flutter analyze
      - name: Testes de unidade
        run: flutter test
      - name: Versão web de teste
        run: flutter build web --profile --wasm --no-web-resources-cdn --dart-define=TEST_BRIDGE=true -o build/web_test
      - uses: actions/upload-artifact@v4
        with:
          name: web_test
          path: build/web_test
          retention-days: 3

  e2e:
    name: Playwright (${{ matrix.project }})
    needs: flutter
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [iphone-se, iphone-pro-max, android-pequeno, tablet]
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web_test
          path: build/web_test
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
      - name: Navegador (Chromium)
        run: npx playwright install --with-deps chromium
      - name: Testes de ponta a ponta
        run: npx playwright test --project=${{ matrix.project }}
      - name: Relatório
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-${{ matrix.project }}
          path: e2e/playwright-report
          retention-days: 14

  android:
    # Builds the Play Store bundle (.aab). With the upload key in the
    # repository secrets it comes out signed and ready to upload; without
    # them it is signed with a throwaway debug key (just proves it builds).
    name: Android (.aab)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYSTORE_BASE64: ${{ secrets.CAPI_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Chave de envio (se configurada)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "CAPI_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Pacote da Play Store
        env:
          CAPI_KEYSTORE_PASSWORD: ${{ secrets.CAPI_KEYSTORE_PASSWORD }}
          CAPI_KEY_ALIAS: ${{ secrets.CAPI_KEY_ALIAS }}
          CAPI_KEY_PASSWORD: ${{ secrets.CAPI_KEY_PASSWORD }}
        run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: capiblocks-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
      # An APK with Google's test ads, to install on a phone and check the
      # ads without touching real ad units.
      - name: APK com anúncios de teste
        env:
          CAPI_KEYSTORE_PASSWORD: ${{ secrets.CAPI_KEYSTORE_PASSWORD }}
          CAPI_KEY_ALIAS: ${{ secrets.CAPI_KEY_ALIAS }}
          CAPI_KEY_PASSWORD: ${{ secrets.CAPI_KEY_PASSWORD }}
        run: flutter build apk --release --dart-define=ADMOB_TEST=true
      - uses: actions/upload-artifact@v4
        with:
          name: capiblocks-apk-teste
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
