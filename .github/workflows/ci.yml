# Verifica o jogo a cada envio e a cada pull request:
# 1. formatação, análise do código e testes de unidade (Flutter);
# 2. versão web de teste (com a ponte de testes) gerada uma vez;
# 3. testes Playwright de ponta a ponta nos 4 tamanhos de tela;
# 4. Android: o pacote da Play Store e o jogo abrindo num emulador. É o job
#    mais caro, então não roda em PRs de rascunho (os minutos do GitHub
#    Actions são contados num repositório privado).
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', '.claude/**']
  # Pull requests always run, so a required check never waits forever on a
  # PR that only touches docs.
  pull_request:
    # ready_for_review: o job do Android roda quando o rascunho fica pronto.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  flutter:
    name: Flutter (análise e testes)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Formatação
        run: dart format --output=none --set-exit-if-changed lib test tool
      - name: Análise
        run: flutter analyze
      - name: Testes de unidade
        run: flutter test
      - name: Versão web de teste
        run: flutter build web --profile --wasm --no-web-resources-cdn --dart-define=TEST_BRIDGE=true -o build/web_test
      - uses: actions/upload-artifact@v4
        with:
          name: web_test
          path: build/web_test
          retention-days: 3

  # Um job só para os 4 tamanhos: prepara o navegador uma vez.
  e2e:
    name: Playwright
    needs: flutter
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web_test
          path: build/web_test
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
      - name: Navegador (Chromium)
        run: npx playwright install --with-deps chromium
      - name: Testes de ponta a ponta
        run: npx playwright test
      - name: Relatório
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-playwright
          path: e2e/playwright-report
          retention-days: 14

  android:
    # Builds the Play Store bundle (.aab). With the upload key in the
    # repository secrets it comes out signed and ready to upload; without
    # them it is signed with a throwaway debug key (just proves it builds).
    # Then installs the release build on an emulator and checks the game
    # opens: the browser tests can't catch Android-only release problems
    # (R8), like the white start screen of v1.0.1.
    name: Android (.aab e abre no emulador)
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      KEYSTORE_BASE64: ${{ secrets.CAPI_KEYSTORE_BASE64 }}
    steps:
      # A imagem do emulador não cabe no disco que sobra depois do build.
      - name: Liberar espaço em disco
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL /usr/share/swift
          sudo docker image prune --all --force > /dev/null || true
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Chave de envio (se configurada)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "CAPI_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Pacote da Play Store
        env:
          CAPI_KEYSTORE_PASSWORD: ${{ secrets.CAPI_KEYSTORE_PASSWORD }}
          CAPI_KEY_ALIAS: ${{ secrets.CAPI_KEY_ALIAS }}
          CAPI_KEY_PASSWORD: ${{ secrets.CAPI_KEY_PASSWORD }}
        run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: capiblocks-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
      - name: Versão da biblioteca de progresso salvo
        run: grep -A7 '^  shared_preferences_android:' pubspec.lock | grep version
      - name: APK de lançamento para o emulador
        env:
          CAPI_KEYSTORE_PASSWORD: ${{ secrets.CAPI_KEYSTORE_PASSWORD }}
          CAPI_KEY_ALIAS: ${{ secrets.CAPI_KEY_ALIAS }}
          CAPI_KEY_PASSWORD: ${{ secrets.CAPI_KEY_PASSWORD }}
        run: flutter build apk --release --target-platform android-x64
      - run: python3 -m pip install pillow
      - name: Liberar o emulador (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Abrir o jogo no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash tool/android_abre.sh
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: android-abre
          path: build/android_abre
          retention-days: 14
      # An APK with Google's test ads, to install on a phone and check the
      # ads without touching real ad units.
      - name: APK com anúncios de teste
        env:
          CAPI_KEYSTORE_PASSWORD: ${{ secrets.CAPI_KEYSTORE_PASSWORD }}
          CAPI_KEY_ALIAS: ${{ secrets.CAPI_KEY_ALIAS }}
          CAPI_KEY_PASSWORD: ${{ secrets.CAPI_KEY_PASSWORD }}
        run: flutter build apk --release --dart-define=ADMOB_TEST=true
      - uses: actions/upload-artifact@v4
        with:
          name: capiblocks-apk-teste
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
