# Verifica o jogo a cada envio e a cada pull request:
# 1. formatação, análise do código e testes de unidade (Flutter);
# 2. versão web de teste (com a ponte de testes) gerada uma vez;
# 3. testes Playwright de ponta a ponta nos 4 tamanhos de tela;
# 4. Android: o pacote da Play Store e o jogo abrindo num emulador. É o job
#    mais caro, então não roda em PRs de rascunho (os minutos do GitHub
#    Actions são contados num repositório privado).
# 5. iOS: o app compila (sem assinatura). Máquina macOS conta 10x os
#    minutos, então só roda quando muda algo do iOS ou das dependências.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', '.claude/**']
  # Pull requests always run, so a required check never waits forever on a
  # PR that only touches docs.
  pull_request:
    # ready_for_review: o job do Android roda quando o rascunho fica pronto.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  flutter:
    name: Flutter (análise e testes)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Formatação
        run: dart format --output=none --set-exit-if-changed lib test tool
      - name: Análise
        run: flutter analyze
      - name: Testes de unidade
        run: flutter test
      - name: Versão web de teste
        run: flutter build web --profile --wasm --no-web-resources-cdn --dart-define=TEST_BRIDGE=true -o build/web_test
      - uses: actions/upload-artifact@v4
        with:
          name: web_test
          path: build/web_test
          retention-days: 3

  # Os 4 tamanhos de tela, divididos em quatro máquinas.
  e2e:
    name: Playwright (${{ matrix.parte }}/4)
    needs: flutter
    # Fixo no 24.04: o ubuntu-latest virou 26.04, que o Playwright 1.56
    # ainda não suporta ("does not support chromium on ubuntu26.04").
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # Um quarto dos testes em cada máquina, um navegador por vez: com dois
    # navegadores desenhando sem GPU na mesma máquina de 2 núcleos, a
    # página travava de vez em quando e o teste estourava o tempo. São
    # quatro máquinas porque o jogo roda numa thread só (veja e2e/serve.py):
    # sem GPU ele fica quase 3 vezes mais lento, e em duas máquinas cada
    # metade levava mais de meia hora.
    strategy:
      fail-fast: false
      matrix:
        parte: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web_test
          path: build/web_test
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
      - name: Navegador (Chromium)
        # O --with-deps baixa pacotes do espelho do Ubuntu, que às vezes fica
        # fora do ar no runner (cada tentativa leva vários minutos até
        # desistir). Uma tentativa de até 4 minutos; se não der, instala só o
        # navegador, usando as bibliotecas que a imagem do runner já tem.
        run: |
          timeout 240 npx playwright install --with-deps chromium && exit 0
          echo "::warning::Espelho do Ubuntu fora do ar: instalando só o navegador"
          npx playwright install chromium
      - name: Testes de ponta a ponta
        run: npx playwright test --shard=${{ matrix.parte }}/4 --workers=1
      - name: Relatório
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-playwright-${{ matrix.parte }}
          path: e2e/playwright-report
          retention-days: 14

  android:
    # Builds the Play Store bundle (.aab). With the upload key in the
    # repository secrets it comes out signed and ready to upload; without
    # them it is signed with a throwaway debug key (just proves it builds).
    # Then installs the release build on an emulator and checks the game
    # opens: the browser tests can't catch Android-only release problems
    # (R8), like the white start screen of v1.0.1.
    name: Android (.aab e abre no emulador)
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    # Fixo, como o Playwright: no ubuntu-latest (26.04) o emulador às vezes
    # caía no meio do teste.
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      KEYSTORE_BASE64: ${{ secrets.CAPI_KEYSTORE_BASE64 }}
    steps:
      # A imagem do emulador não cabe no disco que sobra depois do build.
      - name: Liberar espaço em disco
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL /usr/share/swift
          sudo docker image prune --all --force > /dev/null || true
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # android/gradle.properties pede 8 GB para o Gradle; a máquina do CI tem
      # menos e caía no meio do build ("runner has received a shutdown
      # signal"). O gradle.properties do usuário vale mais que o do projeto.
      - name: Memória do Gradle
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError
          kotlin.daemon.jvmargs=-Xmx1g
          PROPS
      - name: Chave de envio (se configurada)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "CAPI_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Pacote da Play Store
        env:
          CAPI_KEYSTORE_PASSWORD: ${{ secrets.CAPI_KEYSTORE_PASSWORD }}
          CAPI_KEY_ALIAS: ${{ secrets.CAPI_KEY_ALIAS }}
          CAPI_KEY_PASSWORD: ${{ secrets.CAPI_KEY_PASSWORD }}
        run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: capiblocks-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
      - name: Versão da biblioteca de progresso salvo
        run: grep -A7 '^  shared_preferences_android:' pubspec.lock | grep version
      - name: Fecha o Gradle do build anterior (libera memória)
        run: (cd android && ./gradlew --stop) || true
      - name: APK de lançamento para o emulador
        env:
          CAPI_KEYSTORE_PASSWORD: ${{ secrets.CAPI_KEYSTORE_PASSWORD }}
          CAPI_KEY_ALIAS: ${{ secrets.CAPI_KEY_ALIAS }}
          CAPI_KEY_PASSWORD: ${{ secrets.CAPI_KEY_PASSWORD }}
        run: flutter build apk --release --target-platform android-x64
      - run: python3 -m pip install pillow
      - name: Liberar o emulador (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Abrir o jogo no emulador
        # The emulator once died mid-test and adb waited 40 minutes for it.
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          ram-size: 4096M
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash tool/android_abre.sh
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: android-abre
          path: build/android_abre
          retention-days: 14
      # An APK with Google's test ads, to install on a phone and check the
      # ads without touching real ad units.
      - name: Fecha o Gradle antes do APK de teste
        run: (cd android && ./gradlew --stop) || true
      - name: APK com anúncios de teste
        env:
          CAPI_KEYSTORE_PASSWORD: ${{ secrets.CAPI_KEYSTORE_PASSWORD }}
          CAPI_KEY_ALIAS: ${{ secrets.CAPI_KEY_ALIAS }}
          CAPI_KEY_PASSWORD: ${{ secrets.CAPI_KEY_PASSWORD }}
        run: flutter build apk --release --dart-define=ADMOB_TEST=true
      - uses: actions/upload-artifact@v4
        with:
          name: capiblocks-apk-teste
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  # Decide se o iOS precisa compilar de novo: o código Dart já é checado no
  # job do Flutter; o que só o Xcode pega são o projeto nativo e os plugins.
  mudancas:
    name: Mudanças
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ios: ${{ steps.filtro.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filtro
        with:
          filters: |
            ios:
              - 'ios/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - '.github/workflows/ci.yml'

  ios:
    name: iOS (compila)
    needs: mudancas
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' || needs.mudancas.outputs.ios == 'true')
      && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    # O Firebase 13 pede Swift 6.2 (Xcode 26), e a App Store só aceita apps
    # feitos com o SDK do iOS 26. A máquina macos-26 ficou na fila sem
    # aparecer; a macos-15 traz o Xcode 26 instalado (escolhido abaixo).
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - run: flutter pub get
      - name: App iOS (sem assinatura)
        run: flutter build ios --release --no-codesign
      - name: Tamanho do app
        run: du -sh build/ios/iphoneos/Runner.app
