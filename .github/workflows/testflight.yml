# Envia o app iOS ao TestFlight: Actions → "iOS: TestFlight" → Run workflow.
#
# Assinatura: a cada envio, tool/asc_assinatura.py cria pela API do App
# Store Connect (secrets ASC_ISSUER_ID, ASC_KEY_ID e ASC_KEY_P8, função
# Admin) uma chave nova, um certificado de distribuição e o perfil "CapiBlocks
# CI"; no fim o certificado é revogado. Nenhuma chave fica guardada. Só roda
# à mão: a máquina macOS conta 10x os minutos do GitHub Actions.
name: 'iOS: TestFlight'

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  testflight:
    name: Compila, assina e envia ao TestFlight
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASSINATURA: ${{ github.workspace }}/../assinatura
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Chave da API do App Store Connect
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          test -n "$ASC_ISSUER_ID" && test -n "$ASC_KEY_ID" && test -n "$ASC_KEY_P8" \
            || { echo "::error::Faltam os secrets ASC_ISSUER_ID, ASC_KEY_ID ou ASC_KEY_P8"; exit 1; }
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyjwt cryptography
      - name: Certificado e perfil do envio
        run: $RUNNER_TEMP/venv/bin/python tool/asc_assinatura.py criar "$ASSINATURA"
      - name: Chaveiro temporário
        run: |
          KC="$RUNNER_TEMP/assinatura.keychain-db"
          SENHA=$(openssl rand -hex 24)
          /usr/bin/openssl x509 -inform der -in "$ASSINATURA/cert.der" -out "$ASSINATURA/cert.pem"
          # The system's LibreSSL writes a .p12 the keychain can read.
          /usr/bin/openssl pkcs12 -export -inkey "$ASSINATURA/key.pem" -in "$ASSINATURA/cert.pem" \
            -out "$ASSINATURA/cert.p12" -passout "pass:$SENHA"
          security create-keychain -p "$SENHA" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$SENHA" "$KC"
          security import "$ASSINATURA/cert.p12" -k "$KC" -P "$SENHA" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$SENHA" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$ASSINATURA/key.pem" "$ASSINATURA/cert.p12"
          UUID=$(security cms -D -i "$ASSINATURA/perfil.mobileprovision" | plutil -extract UUID raw -)
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                   "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"
            cp "$ASSINATURA/perfil.mobileprovision" "$d/$UUID.mobileprovision"
          done
          security find-identity -v -p codesigning "$KC"
      # The version comes from pubspec.yaml; the build number must grow with
      # every upload, so it is this workflow's run number.
      - name: Flutter (configuração do iOS)
        run: flutter build ios --release --config-only --build-number=${{ github.run_number }}
      - name: Arquivo do Xcode (assinado)
        run: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ios/Runner.xcarchive
      - name: Envia ao App Store Connect
        run: |
          xcodebuild -exportArchive \
            -archivePath build/ios/Runner.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath build/ios/ipa \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Revoga o certificado e apaga as chaves
        if: always()
        run: |
          if [ -x "$RUNNER_TEMP/venv/bin/python" ] && [ -f "$RUNNER_TEMP/AuthKey.p8" ]; then
            "$RUNNER_TEMP/venv/bin/python" tool/asc_assinatura.py revogar "$ASSINATURA" || true
          fi
          security delete-keychain "$RUNNER_TEMP/assinatura.keychain-db" 2>/dev/null || true
          rm -rf "$ASSINATURA" "$RUNNER_TEMP/AuthKey.p8"
